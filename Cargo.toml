[package]
name = "forge_engine"
version = "0.3.2"
edition = "2024"
default-run = "forge_editor"

[dependencies]
bevy = "=0.16.1"
bevy_egui = "=0.35.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
uuid = { version = "1", features = ["v4", "serde"] }
mlua = { version = "0.10", features = ["lua54", "vendored", "send"] }

[profile.release]
lto = "thin"
