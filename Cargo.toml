[package]
name = "forge_engine"
version = "0.7.5"
edition = "2024"
default-run = "forge_editor"

[dependencies]
bevy = { version = "=0.16.1", features = ["wav"] }
bevy_egui = "=0.35.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
uuid = { version = "1", features = ["v4", "serde"] }
sysinfo = "0.35"
mlua = { version = "0.10", features = ["lua54", "vendored", "send"] }

rapier2d = "=0.22.0"

[profile.release]
lto = "thin"
