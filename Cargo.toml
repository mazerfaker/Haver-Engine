[package]
name = "forge_engine"
version = "0.7.34"
edition = "2024"
default-run = "forge_editor"

[features]
default = ["editor", "physics-rapier", "lua", "audio", "lighting"]
physics-rapier = ["dep:rapier2d"]
lua = ["dep:mlua"]
audio = ["bevy/bevy_audio", "bevy/vorbis", "bevy/wav"]
lighting = []
gpu-lab = ["lighting"]
gpu-instancing-lab = ["gpu-lab"]
audio-dsp-lab = ["audio"]
editor = ["dep:rfd", "dep:sysinfo", "physics-rapier", "lua", "audio", "lighting"]

[[bin]]
name = "forge_editor"
path = "src/bin/forge_editor.rs"
required-features = ["editor"]

[dependencies]
bevy = { version = "=0.16.1", default-features = false, features = ["std", "async_executor", "multi_threaded", "bevy_asset", "bevy_color", "bevy_core_pipeline", "bevy_render", "bevy_sprite", "bevy_text", "bevy_ui", "bevy_window", "bevy_winit", "bevy_gilrs", "default_font", "png", "jpeg", "x11"] }
bevy_egui = "=0.35.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = { version = "0.15", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
uuid = { version = "1", features = ["v4", "serde"] }
sysinfo = { version = "0.35", optional = true }
mlua = { version = "0.10", optional = true, features = ["lua54", "vendored", "send"] }

rapier2d = { version = "=0.22.0", optional = true }

[profile.release]
lto = "thin"
strip = "debuginfo"

[profile.performance]
inherits = "release"
opt-level = 3
codegen-units = 1

[profile.lightweight]
inherits = "release"
opt-level = "z"
codegen-units = 1
strip = "symbols"
lto = "fat"

[profile.development]
inherits = "dev"
opt-level = 1


[[example]]
name = "gpu_lighting_lab"
path = "experimental/gpu_lighting_lab.rs"
required-features = ["gpu-lab"]

[[example]]
name = "gpu_particle_lab"
path = "experimental/gpu_particle_lab.rs"
required-features = ["gpu-lab"]

# Isolated from the existing GPU runtime and its routine checks.
[[example]]
name = "gpu_instancing_lab"
path = "experimental/gpu_instancing_lab.rs"
required-features = ["gpu-instancing-lab"]

[[example]]
name = "audio_dsp_lab"
path = "experimental/audio_dsp_lab.rs"
required-features = ["audio-dsp-lab"]
