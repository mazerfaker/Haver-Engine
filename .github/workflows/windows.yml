name: Forge Windows verification
on: [push, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Check modular feature matrix
        shell: powershell
        run: .\tools\qa_matrix.ps1
      - name: Build and verify portable package
        shell: powershell
        run: .\tools\build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ForgeEngine-v0.7.9-Windows-portable
          path: ForgeEngine-v0.7.9-Windows-portable.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Forge-build-log
          path: forge-check.log
          if-no-files-found: warn
